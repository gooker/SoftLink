name: Build release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and package
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { '' }
          ./scripts/build-release.ps1 -Tag $tag

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoftLink-windows-x64
          path: dist/v*/*
          if-no-files-found: error

      - name: Create draft release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $artifacts = @(Get-ChildItem -Path "dist/$env:RELEASE_TAG" -File | Select-Object -ExpandProperty FullName)
          gh release create $env:RELEASE_TAG @artifacts --verify-tag --draft --title "SoftLink $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
